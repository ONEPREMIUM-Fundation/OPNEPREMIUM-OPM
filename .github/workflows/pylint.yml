name: Sovereign Full Stack CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:

  # ============================================
  # 1️⃣ PYTHON BACKEND (if exists)
  # ============================================
  python:
    if: hashFiles('**/*.py') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pylint bandit

      - name: Lint Python
        run: pylint $(git ls-files '*.py') || true

      - name: Security Scan (Bandit)
        run: bandit -r . || true

  # ============================================
  # 2️⃣ NODE / NEXT FRONTEND
  # ============================================
  node:
    if: hashFiles('**/package.json') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  # ============================================
  # 3️⃣ SOLIDITY / FOUNDRY
  # ============================================
  contracts:
    if: hashFiles('**/*.sol') != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup

      - name: Build Contracts
        run: ~/.foundry/bin/forge build

      - name: Run Tests
        run: ~/.foundry/bin/forge test -vv

  # ============================================
  # 4️⃣ ADVANCED SECURITY (OPTIONAL BUT POWERFUL)
  # ============================================
  solidity-security:
    if: hashFiles('**/*.sol') != ''
    runs-on: ubuntu-latest
    needs: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Slither
        run: |
          pip install slither-analyzer

      - name: Run Slither
        run: slither . || true
