name: Full Stack CI

on:
  push:
    branches: [ "main", "One-Premium", "develop" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================
  # ⛓ Solidity / Smart Contracts (Foundry)
  # ============================================
  contracts:
    name: Contracts Build & Test
    runs-on: ubuntu-latest
    if: hashFiles('**/*.sol') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          ~/.foundry/bin/foundryup

      - name: Add Foundry to PATH
        run: echo "$HOME/.foundry/bin" >> $GITHUB_PATH

      - name: Compile Contracts
        run: forge build

      - name: Run Contract Tests
        run: forge test -vv

  # ============================================
  # 🟢 Frontend Build (Node / Next.js / React)
  # ============================================
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    if: hashFiles('**/package.json') != ''

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (if present)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found."
          fi

      - name: Build Frontend
        run: npm run build

  # ============================================
  # 🔒 Optional Security Scan (Slither)
  # ============================================
  slither:
    name: Solidity Security Scan
    runs-on: ubuntu-latest
    needs: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Slither
        run: |
          python3 -m pip install --upgrade pip
          pip install slither-analyzer

      - name: Run Slither
        run: slither .